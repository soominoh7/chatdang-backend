services:
  - type: web
    name: chatdang-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FOODSAFETY_KEY
        sync: false
      - key: DATA_GO_KR_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
